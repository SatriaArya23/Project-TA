# TA NIDS - server penerima rekaman lalu lintas (__DOMAIN__)
# Berdiri sendiri; tidak menyentuh situs lain di server ini.

# Hanya percobaan kirim password (POST /login) yang dibatasi; membuka halaman tidak dihitung.
map $request_method $tanids_login_kunci {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $tanids_login_kunci zone=tanids_login_post:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/tanids.access.log;
    error_log  /var/log/nginx/tanids.error.log;

    client_max_body_size 520m;     # sedikit di atas PENERIMA_MAX_UPLOAD_MB
    client_body_timeout 300s;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 300s;

    location = /login {
        limit_req zone=tanids_login_post burst=5 nodelay;
        proxy_pass http://127.0.0.1:__PORT__;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
    }
}
